<svg width="854" height="180" viewBox="0 0 854 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient Deep Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Retro Neon Cyber Accent Wave Gradient -->
    <linearGradient id="cyberWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#8A2BE2" />
      <stop offset="70%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Ambient Glow for Title -->
    <filter id="neonTitleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Subtle Grid -->
    <pattern id="headerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363D" stroke-width="0.5" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2.5px;
      fill: #FFFFFF;
    }
    .badge-text {
      font-family: "Fira Code", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #A855F7;
    }
    .subtitle-text {
      font-family: "Fira Code", monospace;
      font-size: 13.5px;
      font-weight: 500;
      fill: #E11D48;
      letter-spacing: 1px;
    }
    .status-text {
      font-family: "Fira Code", monospace;
      font-size: 10.5px;
      font-weight: 600;
      fill: #00FF66;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Deep Background Box with Border -->
  <rect width="854" height="180" rx="12" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.2" />
  <rect width="854" height="180" rx="12" fill="url(#headerGrid)" />

  <!-- Dynamic Wavy Cyber Ribbon (Animated SVG Path) -->
  <g opacity="0.55">
    <path fill="url(#cyberWaveGrad)">
      <animate
        attributeName="d"
        dur="18s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.5;1"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
        values="
          M 0 145 Q 213 115 427 150 T 854 135 L 854 180 L 0 180 Z;
          M 0 135 Q 213 160 427 130 T 854 150 L 854 180 L 0 180 Z;
          M 0 145 Q 213 115 427 150 T 854 135 L 854 180 L 0 180 Z
        "
      />
    </path>
    <path fill="url(#cyberWaveGrad)" opacity="0.4">
      <animate
        attributeName="d"
        dur="14s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.5;1"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
        values="
          M 0 150 Q 213 170 427 140 T 854 160 L 854 180 L 0 180 Z;
          M 0 160 Q 213 135 427 165 T 854 140 L 854 180 L 0 180 Z;
          M 0 150 Q 213 170 427 140 T 854 160 L 854 180 L 0 180 Z
        "
      />
    </path>
  </g>

  <!-- Cybernetic HUD Corner Accents -->
  <g stroke-width="1.5">
    <path d="M 16 30 L 16 16 L 30 16" stroke="#A855F7" fill="none" opacity="0.8" />
    <path d="M 838 30 L 838 16 L 824 16" stroke="#FF0055" fill="none" opacity="0.8" />
    <line x1="40" y1="16" x2="120" y2="16" stroke="#30363D" opacity="0.5" />
    <line x1="734" y1="16" x2="814" y2="16" stroke="#30363D" opacity="0.5" />
  </g>

  <!-- Status Online Indicator Capsule -->
  <g transform="translate(40, 36)">
    <rect width="112" height="22" rx="11" fill="#0D1117" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="11" r="3.5" fill="#00FF66" />
    <text x="25" y="14.5" class="status-text">SYS.ONLINE</text>
  </g>

  <!-- University / Faculty Identification Pill -->
  <g transform="translate(620, 36)">
    <rect width="194" height="22" rx="11" fill="#0D1117" stroke="#7928CA" stroke-width="1" />
    <text x="97" y="14.5" text-anchor="middle" class="badge-text">UNAC // FIEE SISTEMAS</text>
  </g>

  <!-- Main Persona Typography -->
  <text x="427" y="90" text-anchor="middle" class="title-text" filter="url(#neonTitleGlow)">
    EDGAR RAMOS TRUJILLO
  </text>

  <!-- Domain Specialization Pipeline Subtitle -->
  <text x="427" y="122" text-anchor="middle" class="subtitle-text">
    AI ENGINEERING ❯ AUTONOMOUS AGENTS (MCP) ❯ CLOUD DEVOPS
  </text>
</svg>